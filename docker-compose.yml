services:
  cestats:
    build: .
    restart: unless-stopped
    ports:
      # Bind to loopback only and put Caddy/Nginx in front for TLS.
      - "127.0.0.1:3100:3100"
    environment:
      # Required in production; the mod sends this as the x-api-key header.
      CESTATS_API_KEY: ${CESTATS_API_KEY:?set CESTATS_API_KEY in .env}
      CESTATS_SITE_URL: ${CESTATS_SITE_URL:-http://127.0.0.1:3100}
      CESTATS_DB: /data/cestats.db
    volumes:
      - cestats-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  cestats-data:
