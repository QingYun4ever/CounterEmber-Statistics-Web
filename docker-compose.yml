services:
  cestats:
    build: .
    image: cestats:latest
    container_name: cestats
    restart: unless-stopped
    ports:
      # Loopback by default; set CESTATS_BIND=0.0.0.0 to expose it directly.
      - "${CESTATS_BIND:-127.0.0.1}:${CESTATS_PORT:-3100}:3100"
    environment:
      # The public mod no longer receives a shared write key. The admin key is only used by the
      # operator to create/revoke one-time pairing codes and device tokens.
      CESTATS_ADMIN_KEY: ${CESTATS_ADMIN_KEY:-}
      CESTATS_INGEST_ENABLED: ${CESTATS_INGEST_ENABLED:-true}
      CESTATS_SITE_URL: ${CESTATS_SITE_URL:-http://127.0.0.1:3100}
      CESTATS_DB: /data/cestats.db
      CESTATS_SKIN_CACHE: /data/skins
      # Upload the jars from mod/dist/ here and /download lists them automatically.
      CESTATS_MOD_DIR: /data/mods
    volumes:
      - cestats-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  cestats-data:
